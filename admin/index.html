<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>문의함 — 새싹 공방 관리자</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <style>
    :root { --berry: #6a1b3d; --blush: #f4c6d3; --petal: #fbe4ea; --milk: #fff7f5; --rose: #e39ab0; --ease: cubic-bezier(0.16, 1, 0.3, 1); }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; background: var(--petal); color: var(--berry); font: 400 16px/1.6 'Pretendard Variable', Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif; word-break: keep-all; }
    main { max-width: 44rem; margin: 0 auto; padding: 1.5rem 1rem 4rem; }
    h1 { font-size: 1.25rem; margin: 0 0 1.5rem; }
    button, input { font: inherit; }
    :focus-visible { outline: 3px solid var(--berry); outline-offset: 3px; }
    .login { display: grid; gap: 0.75rem; margin-top: 18vh; padding: 1.5rem; border-radius: 1.75rem; background: var(--milk); }
    .login label { font-weight: 700; }
    .login input { min-height: 3.25rem; padding: 0 1rem; border: 2px solid rgba(106, 27, 61, 0.25); border-radius: 1rem; background: #fff; color: var(--berry); font-size: 1rem; }
    .btn { min-height: 3rem; padding: 0 1.25rem; border: 0; border-radius: 999px; background: var(--berry); color: var(--milk); font-weight: 700; cursor: pointer; transition: transform 0.4s var(--ease); }
    .btn:active { transform: scale(0.97); }
    .btn--ghost { background: transparent; color: var(--berry); border: 2px solid rgba(106, 27, 61, 0.3); }
    .msg { min-height: 1.5em; font-weight: 700; color: #b3261e; margin: 0; }
    .top { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-bottom: 1rem; }
    .count { padding: 1.25rem 1.5rem; border-radius: 1.75rem; background: var(--berry); color: var(--milk); margin-bottom: 1.5rem; }
    .count b { display: block; font-size: 3rem; line-height: 1.1; }
    .list { display: grid; gap: 1rem; padding: 0; margin: 0; list-style: none; }
    .item { padding: 1.25rem; border-radius: 1.5rem; background: var(--milk); border: 2px solid transparent; }
    .item.is-new { border-color: var(--berry); }
    .item__date { font-size: 0.875rem; opacity: 0.7; }
    .item__name { font-size: 1.25rem; font-weight: 700; margin: 0.25rem 0; }
    .item__contact { display: inline-block; padding: 0.375rem 0.75rem; margin: 0.25rem 0; border: 0; border-radius: 0.75rem; background: var(--petal); color: var(--berry); font-weight: 700; cursor: pointer; user-select: all; }
    .item__row { margin: 0.25rem 0; }
    .item__row span { font-weight: 700; margin-right: 0.5rem; }
    .status { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem; margin-top: 1rem; }
    .status button { min-height: 2.75rem; border-radius: 999px; border: 2px solid rgba(106, 27, 61, 0.25); background: transparent; color: var(--berry); font-weight: 700; cursor: pointer; }
    .status button[aria-pressed="true"] { background: var(--berry); border-color: var(--berry); color: var(--milk); }
    .empty { padding: 2rem; text-align: center; border-radius: 1.5rem; border: 2px dashed rgba(106, 27, 61, 0.3); }
  </style>
</head>
<body>
  <main>
    <h1>새싹 공방 문의함</h1>

    <form id="login" class="login">
      <label for="pw">관리자 비밀번호</label>
      <input id="pw" type="password" autocomplete="current-password" required>
      <button class="btn" type="submit">들어가기</button>
      <p class="msg" id="login-msg" role="alert"></p>
    </form>

    <section id="board" hidden>
      <div class="top">
        <button class="btn btn--ghost" id="refresh" type="button">새로고침</button>
        <button class="btn btn--ghost" id="logout" type="button">나가기</button>
      </div>
      <div class="count"><b id="new-count">0</b>새 문의</div>
      <p class="msg" id="board-msg" role="alert"></p>
      <ul class="list" id="list"></ul>
    </section>
  </main>

  <script>
    (() => {
      const KEY = 'sessak-admin-pw';
      const STATUSES = ['새 문의', '연락함', '완료'];
      const $ = (id) => document.getElementById(id);
      const login = $('login'), board = $('board'), pw = $('pw'), list = $('list');

      const fmt = (iso) => new Date(iso).toLocaleString('ko-KR', { month: 'long', day: 'numeric', weekday: 'short', hour: '2-digit', minute: '2-digit' });

      const api = async (method, body) => {
        const r = await fetch('/api/admin', {
          method,
          headers: { 'x-admin-password': sessionStorage.getItem(KEY) || '', ...(body ? { 'Content-Type': 'application/json' } : {}) },
          body: body ? JSON.stringify(body) : undefined,
        });
        const data = await r.json().catch(() => ({}));
        if (r.status === 401) { const e = new Error(data.error || '비밀번호가 맞지 않아요.'); e.auth = true; throw e; }
        if (!r.ok) throw new Error(data.error || '불러오지 못했어요.');
        return data;
      };

      const showLogin = (text) => {
        sessionStorage.removeItem(KEY);
        board.hidden = true; login.hidden = false;
        $('login-msg').textContent = text || '';
        pw.value = ''; pw.focus();
      };

      const render = (rows) => {
        $('new-count').textContent = rows.filter((r) => r.status === '새 문의').length;
        list.replaceChildren();
        if (!rows.length) {
          const li = document.createElement('li');
          li.className = 'empty';
          li.textContent = '아직 들어온 문의가 없어요. 사이트의 문의 폼으로 들어오면 여기에 쌓여요.';
          list.append(li);
          return;
        }
        rows.forEach((row) => {
          const li = document.createElement('li');
          li.className = 'item' + (row.status === '새 문의' ? ' is-new' : '');

          const date = document.createElement('div'); date.className = 'item__date'; date.textContent = fmt(row.created_at);
          const name = document.createElement('div'); name.className = 'item__name'; name.textContent = row.name;
          const contact = document.createElement('button'); contact.type = 'button'; contact.className = 'item__contact';
          contact.textContent = row.contact; contact.title = '눌러서 복사';
          contact.addEventListener('click', async () => {
            try { await navigator.clipboard.writeText(row.contact); contact.textContent = '복사했어요'; setTimeout(() => (contact.textContent = row.contact), 1200); }
            catch { const s = getSelection(); const rg = document.createRange(); rg.selectNodeContents(contact); s.removeAllRanges(); s.addRange(rg); }
          });
          const when = document.createElement('p'); when.className = 'item__row';
          const label = document.createElement('span'); label.textContent = '희망 날짜';
          when.append(label, row.preferred_date || '적지 않음');

          const status = document.createElement('div'); status.className = 'status';
          STATUSES.forEach((s) => {
            const b = document.createElement('button'); b.type = 'button'; b.textContent = s;
            b.setAttribute('aria-pressed', String(row.status === s));
            b.addEventListener('click', async () => {
              if (row.status === s) return;
              try { await api('PATCH', { id: row.id, status: s }); await load(); }
              catch (e) { e.auth ? showLogin(e.message) : ($('board-msg').textContent = e.message); }
            });
            status.append(b);
          });

          li.append(date, name, contact, when, status);
          list.append(li);
        });
      };

      const load = async () => {
        $('board-msg').textContent = '';
        const { rows } = await api('GET');
        login.hidden = true; board.hidden = false;
        render(rows);
      };

      login.addEventListener('submit', async (e) => {
        e.preventDefault();
        sessionStorage.setItem(KEY, pw.value);
        try { await load(); }
        catch (err) { err.auth ? showLogin('비밀번호가 맞지 않아요.') : showLogin(err.message); }
      });
      $('refresh').addEventListener('click', () => load().catch((e) => (e.auth ? showLogin(e.message) : ($('board-msg').textContent = e.message))));
      $('logout').addEventListener('click', () => showLogin(''));

      if (sessionStorage.getItem(KEY)) load().catch(() => showLogin(''));
      else pw.focus();
    })();
  </script>
</body>
</html>
